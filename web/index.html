<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App para estudiantes de la Universidad Metropolitana (Unimet).">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Unimet App">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Unimet App</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Tesseract.js v5 — OCR en el navegador.
    Se define window.recognizeCarnetText(), que el código Dart llama
    mediante la declaración @JS('recognizeCarnetText') en ocr_service_web.dart.
  -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    // Worker reutilizable (se inicializa una sola vez por sesión).
    var _tessWorker = null;
    var _tessInit = null;

    function _getWorker() {
      if (_tessWorker) return Promise.resolve(_tessWorker);
      if (_tessInit) return _tessInit;

      _tessInit = Tesseract.createWorker(['spa', 'eng']).then(function(w) {
        _tessWorker = w;
        _tessInit = null;
        return w;
      }).catch(function(e) {
        // Fallback: solo español
        return Tesseract.createWorker('spa').then(function(w) {
          _tessWorker = w;
          _tessInit = null;
          return w;
        });
      });

      return _tessInit;
    }

    /**
     * Función llamada desde Dart (ocr_service_web.dart) vía @JS.
     * @param {string} imageSource - Data URL base64 de la imagen preprocesada.
     * @returns {Promise<string>} Texto reconocido.
     */
    function recognizeCarnetText(imageSource) {
      return _getWorker().then(function(worker) {
        return worker.recognize(imageSource);
      }).then(function(ret) {
        return (ret && ret.data && ret.data.text) ? ret.data.text : '';
      }).catch(function(err) {
        // Si el worker falla, resetear y lanzar el error para que Dart lo reciba
        _tessWorker = null;
        return Promise.reject('OCR error: ' + err);
      });
    }
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
